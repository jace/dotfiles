# kitty shortcuts on macOS, included from kitty.conf.

# Cmd+1…9 to go to a tab, Cmd+0 for the tenth
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
map cmd+0 goto_tab 10

# Cmd+Left/Right as Home/End
map cmd+left send_text normal \e[H
map cmd+left send_text application \eOH
map cmd+right send_text normal \e[F
map cmd+right send_text application \eOF
