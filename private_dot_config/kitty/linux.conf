# kitty shortcuts on Linux, included from kitty.conf.

# Alt+1…9 to go to a tab, Alt+0 for the tenth (the usual Linux convention, and Ghostty's default)
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+0 goto_tab 10

# Tab titles show the Alt shortcut (⎇ is the Alt key symbol)
tab_title_template "{fmt.fg._000}⎇{index} {fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title}"
