# Terminal capabilities: truecolor + proper terminfo
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Let modified keys (Shift+Enter etc.) pass through to apps
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Allow mouse scrolling
setw -g mouse on

# Don't delay Esc — matters hugely in vim/helix
set -s escape-time 10

# Sync clipboard via OSC 52
set -g set-clipboard on

# Let apps know when a pane gains/loses focus
# Disabled because it breaks the prompt with `[O[I` sequences
# set -g focus-events on

# When attached from two differently-sized clients, size
# to the most recently active one instead of the smallest
set -g window-size latest

# Keep window numbers gapless as you close windows
set -g renumber-windows on
