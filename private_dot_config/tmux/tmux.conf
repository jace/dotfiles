# Where is tmux config?
tmux_dir="~/.config/tmux"
tmux_plugins_dir="$tmux_dir/plugins"
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$tmux_plugins_dir"

# Terminal capabilities: truecolor + proper terminfo
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Let modified keys (Shift+Enter etc.) pass through to apps
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# Allow mouse scrolling
set -g mouse on

# Don't delay Esc — matters hugely in vim/helix
set -s escape-time 10

# Sync clipboard via OSC 52
set -g set-clipboard on

# Let apps know when a pane gains/loses focus
# Disabled because it breaks the prompt with `[O[I` sequences
# set -g focus-events on

# When attached from two differently-sized clients, size
# to the most recently active one instead of the smallest
set -g window-size latest

# Number windows and panes from 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
# Keep window numbers gapless as you close windows
set -g renumber-windows on

# Set window titles
set -g set-titles on
#set -g set-titles-string '#{=/-15/…:#{?#{==:#{pane_current_path},#{HOME}},~,#{s|^#{HOME}/|~/|:pane_current_path}}} (#{pane_current_command})
set -g set-titles-string '#{?#{==:#{pane_current_path},#{HOME}},~,#{s|^#{HOME}/|~/|:pane_current_path}} (#{pane_current_command}) #{user}@#{host}'
set -g allow-rename on
set -g automatic-rename on
#set -g automatic-rename-format '#{?#{==:#{pane_current_path},#{HOME}},~,#{s|^#{HOME}/|~/|:pane_current_path}} (#{pane_current_command})'

# Window panes
set -g pane-border-status top
set -g pane-border-format "#{pane_index} #{?#{==:#{pane_current_path},#{HOME}},~,#{s|^#{HOME}/|~/|:pane_current_path}} #{pane_title}"

# Allow shell integration
set-option -g allow-passthrough on
set-option -g allow-set-title on

# --- Keybindings ---
# Ctrl+Space for secondary prefix
set-option -g prefix2 C-Space
bind-key C-Space send-prefix -2
# Reload config
bind-key R source-file ~/.config/tmux/tmux.conf; display "Configuration reloaded"
# With base-index 1, prefix 0 selects window 10
bind-key 0 select-window -t:=10
# Split panes using | and -
bind-key | split-window -h
bind-key - split-window -v
# Switch panes with Alt-arrows
bind-key -n M-Left select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up select-pane -U
bind-key -n M-Down select-pane -D

# --- Theme ---
# Native tmux styling, no plugins: one status line at the bottom showing the
# session on the left, the windows in the middle and host and time on the right.
# (catppuccin is fetched by .chezmoiexternal.toml but not loaded; its status
# modules need the theme loaded first, which is why they rendered nothing.)
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=colour236,fg=colour250"
set -g status-left-length 30
set -g status-left "#[bg=colour31,fg=colour231,bold] #S #[default] "
set -g status-right-length 60
set -g status-right "#{?client_prefix,#[bg=colour166 fg=colour231 bold] PREFIX #[default] ,}#[fg=colour245]#h #[fg=colour250]%a %H:%M "
set -g status-justify left

# Windows: number, name, and a marker when something happened in a background window
set -g window-status-separator ""
set -g window-status-format " #I #W#{?window_activity_flag, •,}#{?window_bell_flag, !,} "
set -g window-status-current-format "#[bg=colour238,fg=colour231,bold] #I #W#{?window_zoomed_flag, (zoom),} "
set -g window-status-activity-style "fg=colour214"
set -g window-status-bell-style "fg=colour203,bold"
set -g monitor-activity on
set -g visual-activity off

# Name windows after what's running in them, and where
set -g automatic-rename-format '#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}'

# Pane borders: the active pane stands out
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour31"

# Messages and the command prompt
set -g message-style "bg=colour31,fg=colour231"
set -g mode-style "bg=colour31,fg=colour231"

# --- Plugins ---
#set -g @plugin "tmux-plugins/tpm"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
#run "$tmux_plugins_dir/tpm/tpm"
