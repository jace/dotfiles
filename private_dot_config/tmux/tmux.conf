# The server inherits the PATH of whatever started it (iTerm2 starts it with a
# bare PATH), so commands tmux runs itself, like fzf for prefix /, aren't found.
# Take PATH from a login shell, which reads ~/.profile (Homebrew and ~/.local/bin).
run-shell "sh -lc 'tmux set-environment -g PATH \"\$PATH\"'"

# Terminal capabilities: truecolor + proper terminfo
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Let modified keys (Shift+Enter etc.) pass through to apps
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# Allow mouse scrolling
set -g mouse on
# The wheel in full-screen programs that don't use the mouse (less, man): send
# arrow keys, as terminals do outside tmux. tmux's default sends them mouse
# events they ignore. Programs that ask for the mouse still get mouse events,
# and at a shell the wheel scrolls tmux's history.
bind-key -n WheelUpPane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { if-shell -F "#{alternate_on}" { send-keys -N 3 Up } { copy-mode -e } }
bind-key -n WheelDownPane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { if-shell -F "#{alternate_on}" { send-keys -N 3 Down } { send-keys -M } }

# Don't delay Esc — matters hugely in vim/helix
set -s escape-time 10

# Sync clipboard via OSC 52
set -g set-clipboard on

# Let apps know when a pane gains/loses focus
# Disabled because it breaks the prompt with `[O[I` sequences
# set -g focus-events on

# When attached from two differently-sized clients, size
# to the most recently active one instead of the smallest
set -g window-size latest

# Scrollback per pane (tmux's default is 2000 lines). Full-screen programs (less,
# vim, Claude Code) run on the alternate screen, which keeps no scrollback, so
# searching their panes only finds what's on screen.
set -g history-limit 50000

# Number windows and panes from 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
# Keep window numbers gapless as you close windows
set -g renumber-windows on

# Set window titles
set -g set-titles on
#set -g set-titles-string '#{=/-15/…:#{?#{==:#{pane_current_path},#{HOME}},~,#{s|^#{HOME}/|~/|:pane_current_path}}} (#{pane_current_command})
# The outer terminal's title (Konsole tab, iTerm2 window): the current window's
# name, then tmux's session and host, as in "Slabby maintenance · tmux main@Slabby"
set -g set-titles-string '#{E:@tab-name} · tmux #{session_name}@#{host_short}'
# Programs can't rename windows (oh-my-zsh sends the screen-style rename code
# at every prompt, which also stops automatic renaming); window names come from
# automatic-rename-format, which uses the title programs set (allow-set-title)
set -g allow-rename off
set -g automatic-rename on
#set -g automatic-rename-format '#{?#{==:#{pane_current_path},#{HOME}},~,#{s|^#{HOME}/|~/|:pane_current_path}} (#{pane_current_command})'

# Window panes
set -g pane-border-status top
# Each pane's title strip shows its number, then its folder for a shell or the
# title a program sets otherwise. A shell's folder comes from its own title
# (user@host:folder, set at each prompt) when it sets one: a title change makes
# tmux redraw the border at once, while the folder tmux tracks itself only
# shows when something else redraws it.
# The active pane's title strip is highlighted like the current tab. tmux's
# default instead colours only half of the border when a window has exactly two
# panes, which reads as a top-and-bottom split even when they're side by side.
set -g pane-border-indicators off
set -g pane-border-format "#{?pane_active,#[fg=colour231#,bg=colour31#,bold],#[fg=colour245]} #{pane_index} #{?#{m:*sh,#{pane_current_command}},#{?#{m/r:^[~/],#{pane_title}},#{pane_title},#{?#{m/r:^[^@ ]+@[A-Za-z0-9._-]+.,#{pane_title}},#{s/^[^@ ]+@[A-Za-z0-9._-]+.//:pane_title},#{?#{==:#{pane_current_path},#{HOME}},~,#{s|^#{HOME}/|~/|:pane_current_path}}}},#{pane_title}} #[default]"

# Allow shell integration
set-option -g allow-passthrough on
set-option -g allow-set-title on

# --- Keybindings ---
# -N gives each key a description, so it shows in prefix ? and prefix /
# Ctrl+Space for secondary prefix
set-option -g prefix2 C-Space
bind-key -N "Send the secondary prefix (Ctrl+Space) to the program" C-Space send-prefix -2
# Reload config (\; keeps the message part of the binding)
bind-key -N "Reload tmux.conf" R source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
# With base-index 1, prefix 0 selects window 10
bind-key -N "Select window 10" 0 select-window -t:=10
# Split panes using | and -
bind-key -N "Split the pane left and right" | split-window -h
bind-key -N "Split the pane top and bottom" - split-window -v
# tmux describes % and " as splitting "horizontally" and "vertically", which
# reads backwards; describe them by where the panes go instead
bind-key -N "Split the pane left and right" % split-window -h
bind-key -N "Split the pane top and bottom" '"' split-window -v
# Switch panes with Alt-arrows
bind-key -N "Select the pane to the left" -n M-Left select-pane -L
bind-key -N "Select the pane to the right" -n M-Right select-pane -R
bind-key -N "Select the pane above" -n M-Up select-pane -U
bind-key -N "Select the pane below" -n M-Down select-pane -D
# Alt+1…9 select windows 1 to 9 and Alt+0 window 10, like Command+n in macOS
# terminals (iTerm2's tmux integration already gives Command+n; terminals
# never see Command). Konsole must not keep Alt+n for its own tabs.
bind-key -N "Select window 1" -n M-1 select-window -t :=1
bind-key -N "Select window 2" -n M-2 select-window -t :=2
bind-key -N "Select window 3" -n M-3 select-window -t :=3
bind-key -N "Select window 4" -n M-4 select-window -t :=4
bind-key -N "Select window 5" -n M-5 select-window -t :=5
bind-key -N "Select window 6" -n M-6 select-window -t :=6
bind-key -N "Select window 7" -n M-7 select-window -t :=7
bind-key -N "Select window 8" -n M-8 select-window -t :=8
bind-key -N "Select window 9" -n M-9 select-window -t :=9
bind-key -N "Select window 10" -n M-0 select-window -t :=10
# Alt+Shift+1…9 select panes 1 to 9: on a US layout these arrive as Alt with
# the shifted symbol
bind-key -N "Select pane 1" -n 'M-!' select-pane -t :.1
bind-key -N "Select pane 2" -n 'M-@' select-pane -t :.2
bind-key -N "Select pane 3" -n 'M-#' select-pane -t :.3
bind-key -N "Select pane 4" -n 'M-$' select-pane -t :.4
bind-key -N "Select pane 5" -n 'M-%' select-pane -t :.5
bind-key -N "Select pane 6" -n 'M-^' select-pane -t :.6
bind-key -N "Select pane 7" -n 'M-&' select-pane -t :.7
bind-key -N "Select pane 8" -n 'M-*' select-pane -t :.8
bind-key -N "Select pane 9" -n 'M-(' select-pane -t :.9
# Alt+Shift+F searches the pane's history, like Command+F in iTerm2 (whose tmux
# integration searches tmux's history itself). Inside tmux, the outer
# terminal's own search (Konsole's Ctrl+Shift+F) only sees the screen. Plain
# Alt+F is the shell's forward-word. In the search: Ctrl+R for the previous
# match, Ctrl+S for the next, Enter or Esc to finish, q to leave copy mode.
bind-key -N "Search this pane's history" -n M-F copy-mode \; command-prompt -i -p "(search up)" "send-keys -X search-backward-incremental '%%'"
# prefix q shows pane numbers to pick one by number; keep them up until a key
# is pressed (tmux's default is one second)
bind-key -N "Show pane numbers and select a pane by number" q display-panes -d 0
# Fuzzy-search every key's description and press the chosen one (needs fzf;
# prefix ? is the plain list)
bind-key -N "Search key bindings" / if-shell "command -v fzf" \
  "display-popup -E -w 80% -h 80% -T ' Key bindings ' '~/.config/tmux/key-search.sh \"#{client_name}\"'" \
  "list-keys -N"

# --- Theme ---
# Native tmux styling, no plugins (iTerm2's tmux integration, a control-mode
# client, shows status-left and status-right in its own font without Nerd Font
# glyphs, so it gets them plain): one status line at the bottom, with the
# session on the left, the windows as tabs in the middle, and host and time on
# the right. Tabs are drawn with Nerd Font rounded caps ( ), with an icon for
# the program running in each window.
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=colour235,fg=colour250"
set -g status-justify left
set -g status-left-length 40
set -g status-left "#{?client_control_mode,#S ,#[fg=colour60#,bg=colour235]#[fg=colour231#,bg=colour60#,bold]#S#[fg=colour60#,bg=colour235#,nobold] }"
set -g status-right-length 80
set -g status-right "#{?client_control_mode,#h  %a %H:%M ,#{?pane_in_mode,#[fg=colour214]#[fg=colour235#,bg=colour214#,bold] COPY #[fg=colour214#,bg=colour235#,nobold] ,}#{?client_prefix,#[fg=colour166]#[fg=colour231#,bg=colour166#,bold] PREFIX #[fg=colour166#,bg=colour235#,nobold] ,}#[fg=colour238]#[fg=colour250#,bg=colour238] #h  %a %H:%M #[fg=colour238#,bg=colour235]}"

# Windows as tabs: number, an icon for the running program, and name; a dot
# when a background window has new output, ! for a bell
set -g @tab-icon "#{?#{==:#{pane_current_command},claude},󰚩 ,#{?#{m:*sh,#{pane_current_command}}, ,#{?#{m/r:^n?vim?$,#{pane_current_command}}, ,#{?#{m/r:^(ssh|et|mosh)$,#{pane_current_command}},󰣀 ,#{?#{m/r:^(less|man|bat|glow|jless)$,#{pane_current_command}},󰈙 ,#{?#{m/r:^(btop|htop|top|procs)$,#{pane_current_command}},󰍛 ,#{?#{m/r:^(yazi|broot)$,#{pane_current_command}}, ,#{?#{m/r:^(lazygit|git|tig)$,#{pane_current_command}}, ,}}}}}}}}"
set -g window-status-separator ""
set -g window-status-format "#[fg=colour238,bg=colour235]#[fg=colour250,bg=colour238]#I #{E:@tab-icon}#{E:@tab-name}#{?window_activity_flag, •,}#{?window_bell_flag, !,}#[fg=colour238,bg=colour235]"
set -g window-status-current-format "#[fg=colour31,bg=colour235]#[fg=colour231,bg=colour31,bold]#I #{E:@tab-icon}#{E:@tab-name}#{?window_zoomed_flag, (zoom),}#[fg=colour31,bg=colour235,nobold]"
# The formats above do all the styling: no default underline on the current tab
set -g window-status-style "default"
set -g window-status-current-style "default"
set -g window-status-last-style "default"
set -g window-status-activity-style "none"
set -g window-status-bell-style "none"
set -g monitor-activity on
set -g visual-activity off

# Tab names: the title the running program sets (Claude Code sets its session
# name, prefixed with ✳ when idle, dropped here as some fonts draw it like an
# asterisk, or a spinner while working, kept so busy windows stand out); for a
# shell, its folder as ~/…, shortened from the left; otherwise the command. A
# pane's title is the host name until a program sets one. The tab formats use
# this directly, as tmux's automatic renaming only re-checks when the program
# changes, not after a cd; window names follow it too.
set -g @tab-name "#{?#{m:*sh,#{pane_current_command}},#{?#{m/r:^[~/],#{pane_title}},#{=/-28/…:pane_title},#{?#{m/r:^[^@ ]+@[A-Za-z0-9._-]+.,#{pane_title}},#{=/-28/…:#{s/^[^@ ]+@[A-Za-z0-9._-]+.//:pane_title}},#{?#{==:#{pane_current_path},#{HOME}},~,#{=/-28/…:#{s|^#{HOME}/|~/|:pane_current_path}}}}},#{?#{!=:#{pane_title},#{host}},#{=/32/…;s/^✳ //:pane_title},#{pane_current_command}}}"
set -g automatic-rename-format "#{E:@tab-name}"

# Pane borders: heavy lines, the active pane's in blue
set -g pane-border-lines heavy
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour31"

# Messages and the command prompt
set -g message-style "bg=colour31,fg=colour231"
# Copy mode: the selection in blue, search matches in orange (the current one brighter)
set -g mode-style "bg=colour31,fg=colour231"
set -g copy-mode-match-style "bg=colour166,fg=colour231"
set -g copy-mode-current-match-style "bg=colour214,fg=colour235,bold"
# Popups (prefix /) and menus (right-click) with rounded borders, like the tabs
set -g popup-border-lines rounded
set -g popup-border-style "fg=colour31"
set -g menu-border-lines rounded
set -g menu-border-style "fg=colour31"
set -g menu-style "bg=colour235,fg=colour250"
set -g menu-selected-style "bg=colour31,fg=colour231"
# The big clock (prefix t)
set -g clock-mode-colour colour31

# --- Plugins ---
# tmux-resurrect saves and restores sessions, windows, panes and their folders
# (prefix Ctrl+S saves, prefix Ctrl+R restores); tmux-continuum saves every 15
# minutes and restores the last save when a tmux server starts. chezmoi clones
# both (.chezmoiexternal.toml), so there's no plugin manager. Keep these last:
# continuum hooks its saves into status-right.
set -g @continuum-restore "on"
set -g @continuum-save-interval "15"
if-shell "test -f ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux" "run-shell ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux"
if-shell "test -f ~/.config/tmux/plugins/tmux-continuum/continuum.tmux" "run-shell ~/.config/tmux/plugins/tmux-continuum/continuum.tmux"
